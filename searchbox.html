<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .search-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            border: 2px solid #ddd;
            border-radius: 25px;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .search-box:focus-within {
            border-color: #007bff;
        }
        .search-input {
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            width: 100%;
            outline: none;
        }
        .search-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h2>Search Engine</h2>
        
        <form action="https://formsubmit.co/YOUR_EMAIL@gmail.com" method="POST">
            
            <div class="search-box">
                <input type="text" name="User Search Query" class="search-input" placeholder="Search anything here..." required>
                <button type="submit" class="search-button">Search</button>
            </div>
            
        </form>
    </div>

</body>
</html>
